<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Settings — Fixup</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="customer-layout">
    <div class="container-custom" style="max-width: 760px;">
      <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 24px;">Account Settings & Security</h1>

      <!-- Change Password Card -->
      <div class="card-fixup" style="margin-bottom: 30px;">
        <h3 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 18px;">
          <i class="fa-solid fa-lock text-primary"></i> Change Account Password
        </h3>
        <form id="changePasswordForm">
          <div class="form-group">
            <label class="form-label form-label-required">Current Password</label>
            <input type="password" class="form-control-fixup" required>
          </div>
          <div class="form-group">
            <label class="form-label form-label-required">New Password</label>
            <input type="password" class="form-control-fixup" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label form-label-required">Confirm New Password</label>
            <input type="password" class="form-control-fixup" required>
          </div>
          <button type="submit" class="btn-fixup btn-primary-fixup btn-sm">Update Password</button>
        </form>
      </div>

      <!-- Notifications -->
      <div class="card-fixup">
        <h3 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 18px;">
          <i class="fa-solid fa-bell text-warning"></i> Dispatch Alerts & Notifications
        </h3>
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
            <div>
              <strong>WhatsApp Live Tracking Updates</strong>
              <div style="font-size: 0.8rem; color: var(--text-muted);">Receive technician arrival notifications and direct call links</div>
            </div>
            <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--primary);">
          </label>
          <hr style="border-color: var(--border-color); margin: 0;">
          <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
            <div>
              <strong>Email Invoices & Work Warranty Certificates</strong>
              <div style="font-size: 0.8rem; color: var(--text-muted);">PDF receipts and 30-day warranty documents</div>
            </div>
            <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--primary);">
          </label>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = window.FixupStore.getSession();
      if (!session || session.role !== 'CUSTOMER') {
        window.location.href = '../pages/login.html';
        return;
      }

      document.getElementById('changePasswordForm').addEventListener('submit', (e) => {
        e.preventDefault();
        window.FixupToast.show('Password Updated', 'Your security password has been updated.', 'success');
        e.target.reset();
      });
    });
  </script>
</body>
</html>
