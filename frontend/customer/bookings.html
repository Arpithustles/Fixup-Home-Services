<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — Fixup Customer Portal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="customer-layout">
    <div class="container-custom">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.2rem; font-weight: 900;">My Service Bookings</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin: 4px 0 0 0;">View all your historical and active service dispatches.</p>
        </div>
        <a href="../pages/request-service.html" class="btn-fixup btn-primary-fixup btn-sm">
          <i class="fa-solid fa-calendar-plus"></i> New Request
        </a>
      </div>

      <!-- Filter tabs -->
      <div style="display: flex; gap: 10px; margin-bottom: 24px;">
        <button class="btn-fixup btn-primary-fixup btn-sm filter-tab active" data-filter="all">All</button>
        <button class="btn-fixup btn-secondary-fixup btn-sm filter-tab" data-filter="active">Active</button>
        <button class="btn-fixup btn-secondary-fixup btn-sm filter-tab" data-filter="completed">Completed</button>
        <button class="btn-fixup btn-secondary-fixup btn-sm filter-tab" data-filter="cancelled">Cancelled</button>
      </div>

      <div id="customerAllBookingsMount">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <!-- Cancel Booking Modal -->
  <div id="cancelModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:var(--bg-modal); border-radius:var(--radius-xl); padding:32px; max-width:520px; width:90%; box-shadow:var(--shadow-xl); position:relative;">
      <button onclick="closeCancelModal()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.5rem;color:var(--text-muted);cursor:pointer;">&times;</button>
      <h2 style="font-size:1.4rem;font-weight:900;margin-bottom:4px;">Cancel Booking</h2>
      <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:20px;" id="cancelModalBookingInfo">Loading booking details...</p>
      
      <div id="cancelFeeBlock" style="background:var(--bg-surface-secondary);border-radius:var(--radius-md);padding:16px;margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.9rem;">
          <span>Booking Amount</span><strong id="cancelBookingAmt">₹0</strong>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.9rem;color:var(--danger);">
          <span>Cancellation Fee (<span id="cancelPct">0</span>% — <span id="cancelTier">—</span>)</span>
          <strong id="cancelFee">₹0</strong>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:1rem;font-weight:800;color:var(--success);border-top:1px solid var(--border-color);padding-top:8px;margin-top:8px;">
          <span>Refund Amount</span><strong id="cancelRefund">₹0</strong>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label form-label-required">Reason for Cancellation</label>
        <select id="cancelReason" class="form-control-fixup">
          <option value="">Select a reason...</option>
          <option value="Changed my mind">Changed my mind</option>
          <option value="Found another service provider">Found another service provider</option>
          <option value="Incorrect booking details">Incorrect booking details</option>
          <option value="Service no longer required">Service no longer required</option>
          <option value="Professional delay">Professional delay</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:24px;">
        <label class="form-label">Additional Comments (optional)</label>
        <textarea id="cancelComments" class="form-control-fixup" rows="3" placeholder="Any additional details about your cancellation..."></textarea>
      </div>

      <div style="display:flex;gap:12px;">
        <button onclick="closeCancelModal()" class="btn-fixup btn-secondary-fixup" style="flex:1;">Keep Booking</button>
        <button onclick="confirmCancellation()" class="btn-fixup" style="flex:1;background:var(--danger);color:#fff;border:none;" id="confirmCancelBtn">Confirm Cancellation</button>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let _cancelBookingId = null;

    function openCancelModal(bookingId) {
      _cancelBookingId = bookingId;
      const booking = window.FixupStore.getBookingById(bookingId);
      if (!booking) return;
      
      document.getElementById('cancelModalBookingInfo').textContent = `${booking.serviceName} — ${booking.date} (${booking.timeSlot})`;
      
      const feeCalc = window.FixupStore.calculateCancellationFee(bookingId);
      if (feeCalc && feeCalc.eligible) {
        document.getElementById('cancelBookingAmt').textContent = '₹' + feeCalc.bookingAmount;
        document.getElementById('cancelPct').textContent = feeCalc.percentage;
        document.getElementById('cancelTier').textContent = feeCalc.tier;
        document.getElementById('cancelFee').textContent = '₹' + feeCalc.charge;
        document.getElementById('cancelRefund').textContent = '₹' + feeCalc.refund;
      }
      
      document.getElementById('cancelReason').value = '';
      document.getElementById('cancelComments').value = '';
      document.getElementById('cancelModal').style.display = 'flex';
    }

    function closeCancelModal() {
      document.getElementById('cancelModal').style.display = 'none';
      _cancelBookingId = null;
    }

    function confirmCancellation() {
      const reason = document.getElementById('cancelReason').value;
      if (!reason) { window.FixupToast && window.FixupToast.show('Required', 'Please select a cancellation reason.', 'warning'); return; }
      const comments = document.getElementById('cancelComments').value;
      
      const result = window.FixupStore.cancelBooking(_cancelBookingId, { reason, comments, cancelledBy: 'CUSTOMER' });
      if (result.success) {
        closeCancelModal();
        window.FixupToast && window.FixupToast.show('Booking Cancelled', `Refund of ₹${result.feeCalc.refund} will be processed within 5–7 business days.`, 'info', 5000);
        render();
      } else {
        window.FixupToast && window.FixupToast.show('Cannot Cancel', result.message, 'danger');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = window.FixupStore.getSession();
      if (!session || session.role !== 'CUSTOMER') {
        window.location.href = '../pages/login.html';
        return;
      }

      const mount = document.getElementById('customerAllBookingsMount');
      const tabs = document.querySelectorAll('.filter-tab');
      let currentFilter = 'all';

      function render() {
        const bookings = window.FixupStore.getBookingsForCustomer(session.userId);
        const filtered = bookings.filter(b => {
          if (currentFilter === 'active') return b.status !== 'completed' && b.status !== 'cancelled';
          if (currentFilter === 'completed') return b.status === 'completed';
          if (currentFilter === 'cancelled') return b.status === 'cancelled';
          return true;
        });

        if (filtered.length === 0) {
          mount.innerHTML = '<div style="text-align: center; padding: 48px; background: var(--bg-surface); border-radius: var(--radius-lg); color: var(--text-muted);">No bookings found under this filter.</div>';
          return;
        }

        mount.innerHTML = filtered.map(b => {
          // Status badge
          let badgeClass = 'badge-info';
          if (b.status === 'completed') badgeClass = 'badge-success';
          else if (b.status === 'cancelled') badgeClass = 'badge-danger';

          // Action block
          let actionBlock = '';
          if (b.status === 'completed') {
            actionBlock = `
              <button class="btn-fixup btn-secondary-fixup btn-sm" onclick="window.FixupToast.show('Review Recorded', 'Thank you for rating your technician!', 'success');">
                <i class="fa-solid fa-star text-warning"></i> Rate &amp; Review
              </button>
            `;
          } else if (b.status === 'cancelled') {
            const cd = b.cancellationDetails || {};
            actionBlock = `
              <span class="badge-fixup badge-danger" style="font-size:0.78rem;letter-spacing:0.04em;">CANCELLED</span>
              ${cd.refund !== undefined ? `<span style="font-size:0.82rem;color:var(--text-muted);margin-left:8px;">Refund: ₹${cd.refund}</span>` : ''}
            `;
          } else if (b.status === 'pending' || b.status === 'assigned' || b.status === 'accepted') {
            actionBlock = `
              <button class="btn-fixup btn-sm" style="background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);" onclick="openCancelModal('${b.id}')">
                <i class="fa-solid fa-xmark"></i> Cancel Booking
              </button>
            `;
          } else {
            // in_progress or any other
            actionBlock = `<span style="font-weight: 700; color: var(--primary);"><i class="fa-solid fa-spinner fa-spin"></i> In Progress</span>`;
          }

          return `
          <div class="card-fixup" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px;">
              <div>
                <span class="badge-fixup badge-primary">${b.id}</span>
                ${b.isEmergency ? '<span class="badge-fixup badge-danger"><i class="fa-solid fa-bolt"></i> Emergency Rush</span>' : ''}
                <h3 style="font-size: 1.3rem; font-weight: 800; margin-top: 6px;">${b.serviceName}</h3>
                <p style="color: var(--text-muted); font-size: 0.88rem; margin: 4px 0 0 0;">
                  <i class="fa-solid fa-location-dot text-danger"></i> ${b.customerAddress}
                </p>
              </div>
              <div style="text-align: right;">
                <span class="badge-fixup ${badgeClass}">
                  ${b.status.replace('_', ' ').toUpperCase()}
                </span>
                <div style="font-size: 1.45rem; font-weight: 900; color: var(--primary); margin-top: 4px;">₹${b.totalAmount}</div>
              </div>
            </div>

            <div style="background: var(--bg-surface-secondary); padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <div>
                <strong>Assigned Pro:</strong> ${b.providerName} • <strong>Date:</strong> ${b.date} (${b.timeSlot})
              </div>
              <div>
                ${actionBlock}
              </div>
            </div>
          </div>
        `;
        }).join('');
      }

      // Expose render globally for confirmCancellation
      window.render = render;

      tabs.forEach(t => {
        t.addEventListener('click', () => {
          tabs.forEach(tab => {
            tab.classList.remove('btn-primary-fixup', 'active');
            tab.classList.add('btn-secondary-fixup');
          });
          t.classList.add('btn-primary-fixup', 'active');
          t.classList.remove('btn-secondary-fixup');
          currentFilter = t.dataset.filter;
          render();
        });
      });

      render();
    });
  </script>
</body>
</html>
