<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile — Fixup</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="customer-layout">
    <div class="container-custom" style="max-width: 760px;">
      <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 24px;">Personal Profile & Addresses</h1>

      <div class="card-fixup">
        <form id="customerProfileForm">
          <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color);">
            <div class="welcome-avatar-circle" id="profAvatar" style="width: 70px; height: 70px; font-size: 1.6rem;">U</div>
            <div>
              <h3 style="font-size: 1.3rem; font-weight: 800; margin: 0;" id="profNameDisplay">Customer Name</h3>
              <span class="badge-fixup badge-success"><i class="fa-solid fa-circle-check"></i> Phone & Email Verified</span>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label form-label-required">Full Legal Name</label>
              <input type="text" id="profName" class="form-control-fixup" required>
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Date of Birth</label>
              <input type="date" id="profDob" class="form-control-fixup">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Email Address (Primary)</label>
              <input type="email" id="profEmail" class="form-control-fixup" readonly>
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Mobile Number</label>
              <input type="tel" id="profPhone" class="form-control-fixup" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label form-label-required">Saved Delivery Address</label>
            <input type="text" id="profAddress" class="form-control-fixup" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label form-label-required">City</label>
              <input type="text" id="profCity" class="form-control-fixup" required>
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Pincode</label>
              <input type="text" id="profPincode" class="form-control-fixup" required>
            </div>
          </div>

          <button type="submit" class="btn-fixup btn-primary-fixup btn-lg" style="width: 100%;">
            <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = window.FixupStore.getSession();
      if (!session || session.role !== 'CUSTOMER') {
        window.location.href = '../pages/login.html';
        return;
      }

      const cust = (window.FixupStore.data.customers || []).find(c => c.id === session.userId) || window.FixupStore.data.customers[0];

      document.getElementById('profNameDisplay').textContent = cust.name;
      document.getElementById('profAvatar').textContent = cust.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('profName').value = cust.name;
      document.getElementById('profDob').value = cust.dob || '1995-05-15';
      document.getElementById('profEmail').value = cust.email;
      document.getElementById('profPhone').value = cust.phone;
      document.getElementById('profAddress').value = cust.address || 'Lotus Boulevard, Sector 100';
      document.getElementById('profCity').value = cust.city || 'Noida';
      document.getElementById('profPincode').value = cust.pincode || '201304';

      document.getElementById('customerProfileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        cust.name = document.getElementById('profName').value;
        cust.phone = document.getElementById('profPhone').value;
        cust.address = document.getElementById('profAddress').value;
        cust.city = document.getElementById('profCity').value;
        cust.pincode = document.getElementById('profPincode').value;
        window.FixupStore.save();
        session.name = cust.name;
        session.phone = cust.phone;
        localStorage.setItem('fixup_user_session_v2', JSON.stringify(session));

        window.FixupToast.show('Profile Updated', 'Your contact details and saved addresses have been updated.', 'success');
      });
    });
  </script>
</body>
</html>
