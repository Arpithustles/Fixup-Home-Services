<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Directory — Fixup Admin</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="dashboard.html" class="admin-sidebar-brand">
      <div class="brand-symbol" style="width: 34px; height: 34px; font-size: 1.1rem; background: #4f46e5;">F</div>
      <span>Fixup <span style="font-size: 0.75rem; color: #4f46e5; text-transform: uppercase;">Admin</span></span>
    </a>
    <ul class="admin-nav-menu">
      <li class="admin-nav-item"><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> <span>Overview Deck</span></a></li>
      <li class="admin-nav-item"><a href="providers.html"><i class="fa-solid fa-user-shield"></i> <span>Providers & KYC</span></a></li>
      <li class="admin-nav-item active"><a href="customers.html"><i class="fa-solid fa-users"></i> <span>Customers</span></a></li>
      <li class="admin-nav-item"><a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> <span>Bookings Dispatch</span></a></li>
      <li class="admin-nav-item"><a href="settings.html"><i class="fa-solid fa-sliders"></i> <span>Pricing & Tariffs</span></a></li>
    </ul>
    <div class="admin-sidebar-footer">
      <a href="../../index.html" class="btn-fixup btn-secondary-fixup btn-sm" style="width: 100%;"><i class="fa-solid fa-globe"></i> <span>Public Site</span></a>
    </div>
  </aside>

  <div class="admin-main-wrap">
    <div class="admin-top-bar">
      <div>
        <h1 style="font-size: 1.85rem; font-weight: 900; margin: 0;">Registered Customer Directory</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin: 2px 0 0 0;">
          All verified customer accounts, delivery addresses, and booking history.
        </p>
      </div>
    </div>

    <div class="admin-table-box">
      <div class="admin-table-header">
        <h3 style="font-size: 1.25rem; font-weight: 800; margin: 0;">Verified Homeowners</h3>
      </div>
      <div style="overflow-x: auto;">
        <table class="admin-data-table">
          <thead>
            <tr>
              <th>Customer Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address / City</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="adminCustomerTableBody">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.FixupStore.requireAdmin('login.html')) return;
      const tbody = document.getElementById('adminCustomerTableBody');
      const customers = window.FixupStore.data.customers || [];

      tbody.innerHTML = customers.map(c => `
        <tr>
          <td>
            <strong>${c.name}</strong>
            <div style="font-size: 0.75rem; color: var(--text-muted);">${c.id} • ${c.username}</div>
          </td>
          <td>${c.email}</td>
          <td>${c.phone}</td>
          <td>${c.address || 'N/A'}, ${c.city || 'Noida'} (${c.pincode || '201304'})</td>
          <td><span class="badge-fixup badge-success"><i class="fa-solid fa-check"></i> Verified</span></td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
