<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixup Admin — Enterprise Control Deck Login</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body style="background: #090e17; color: white;">

  <div class="auth-page-wrapper" style="background: transparent;">
    <div class="auth-card" style="background: #111827; border: 1px solid #1f2937;">
      <div class="auth-header">
        <div class="auth-logo-badge" style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
          <i class="fa-solid fa-terminal"></i>
        </div>
        <h1 class="auth-title" style="color: white;">Admin Portal</h1>
        <p class="auth-subtitle" style="color: #94a3b8;">Restricted Area — Platform Operations & KYC Governance</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label form-label-required" style="color: #e2e8f0;">Admin Username</label>
          <input type="text" id="adminUser" class="form-control-fixup" style="background: #1f2937; border-color: #374151; color: white;" placeholder="admin" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label form-label-required" style="color: #e2e8f0;">Security Password</label>
          <input type="password" id="adminPass" class="form-control-fixup" style="background: #1f2937; border-color: #374151; color: white;" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-fixup btn-primary-fixup btn-lg" style="width: 100%; background: #4f46e5; border-color: #4f46e5; margin-top: 10px;">
          <i class="fa-solid fa-lock"></i> Authorize & Enter Control Room
        </button>
      </form>

      <div style="background: rgba(79, 70, 229, 0.1); border: 1px dashed rgba(79, 70, 229, 0.3); padding: 12px; border-radius: var(--radius-md); margin-top: 24px; font-size: 0.82rem; color: #cbd5e1; text-align: center;">
        <i class="fa-solid fa-circle-info text-primary"></i> <strong>Demo Access Credentials:</strong><br>
        Username: <code>admin</code> • Password: <code>admin123</code>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="../../index.html" style="font-size: 0.85rem; color: #94a3b8;">
          <i class="fa-solid fa-arrow-left"></i> Return to Main Public Website
        </a>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initAdminLogin();
    });
  </script>
</body>
</html>
