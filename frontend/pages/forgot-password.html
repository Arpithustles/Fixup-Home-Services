<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Fixup Account Recovery</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge" style="background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="auth-title">Reset Your Password</h1>
        <p class="auth-subtitle">Enter your registered email address to receive password reset instructions</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label form-label-required">Registered Email Address</label>
          <input type="email" id="forgotEmail" class="form-control-fixup" placeholder="e.g. yourname@example.com" required>
        </div>

        <button type="submit" class="btn-fixup btn-primary-fixup btn-lg" style="width: 100%;">
          <i class="fa-solid fa-paper-plane"></i> Send Password Reset OTP
        </button>
      </form>

      <div id="forgotSuccessNotice" style="display: none; margin-top: 20px; padding: 14px; background: var(--success-light); border: 1px solid var(--success); border-radius: var(--radius-md); font-size: 0.88rem; color: var(--success);">
        <i class="fa-solid fa-circle-check"></i> Reset instructions dispatched! Check your email inbox.
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Remember your password? <a href="login.html" style="font-weight: 700;">Back to Sign In</a>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initForgotPassword();
    });
  </script>
</body>
</html>
