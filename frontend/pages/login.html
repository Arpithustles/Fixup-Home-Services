<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Fixup Home Services</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">F</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your household services or technician desk</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-badge-selector">
        <button type="button" class="role-tab-btn active" data-role="CUSTOMER">
          <i class="fa-solid fa-user"></i> Customer Login
        </button>
        <button type="button" class="role-tab-btn" data-role="SERVICE_PROVIDER">
          <i class="fa-solid fa-screwdriver-wrench"></i> Provider Desk
        </button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label form-label-required">Username or Email Address</label>
          <input type="text" id="loginIdentifier" class="form-control-fixup" placeholder="e.g. priya_verma or rajesh_sharma" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label form-label-required" style="margin: 0;">Password</label>
            <a href="forgot-password.html" style="font-size: 0.82rem; font-weight: 700;">Forgot Password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control-fixup" placeholder="Enter your account password" required>
        </div>

        <button type="submit" class="btn-fixup btn-primary-fixup btn-lg" style="width: 100%; margin-top: 8px;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <!-- Quick Demo Credentials Hint for easy testing -->
      <div style="background: var(--bg-surface-secondary); padding: 12px 16px; border-radius: var(--radius-md); margin-top: 24px; font-size: 0.82rem; color: var(--text-muted); border: 1px dashed var(--border-color);">
        <strong style="color: var(--text-primary);"><i class="fa-solid fa-key"></i> Quick Demo Logins:</strong>
        <div style="margin-top: 4px;"><strong>Customer:</strong> priya_verma / priya123</div>
        <div><strong>Provider:</strong> rajesh_sharma / rajesh123</div>
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account yet?<br>
        <div style="margin-top: 8px; display: flex; justify-content: center; gap: 14px;">
          <a href="customer-register.html" style="font-weight: 700;">Customer Sign Up</a>
          <span>•</span>
          <a href="provider-register.html" style="font-weight: 700; color: var(--success);">Join as Provider</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initLogin();
    });
  </script>
</body>
</html>
