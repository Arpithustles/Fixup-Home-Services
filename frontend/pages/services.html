<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Home Services & Rates — Fixup</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main style="padding: 50px 0 80px 0;">
    <div class="container-custom">
      <div class="section-header" style="margin-bottom: 36px;">
        <span class="section-badge">Verified Catalog</span>
        <h1 class="section-title">Household Services & Fixed Rate Cards</h1>
        <p class="section-subtitle">
          Transparent pricing, insured workmanship, and background-checked technicians for every chore.
        </p>
      </div>

      <!-- Category Filter Pills & Search -->
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 36px;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="catFilterPills">
          <button class="btn-fixup btn-primary-fixup btn-sm cat-btn active" data-cat="all">All Services</button>
          <button class="btn-fixup btn-secondary-fixup btn-sm cat-btn" data-cat="Plumbing">Plumbing</button>
          <button class="btn-fixup btn-secondary-fixup btn-sm cat-btn" data-cat="Electrical">Electrical</button>
          <button class="btn-fixup btn-secondary-fixup btn-sm cat-btn" data-cat="AC Repair">AC Repair</button>
          <button class="btn-fixup btn-secondary-fixup btn-sm cat-btn" data-cat="Cleaning">Cleaning</button>
          <button class="btn-fixup btn-secondary-fixup btn-sm cat-btn" data-cat="Carpentry">Carpentry</button>
          <button class="btn-fixup btn-secondary-fixup btn-sm cat-btn" data-cat="Painting">Painting</button>
        </div>

        <div style="max-width: 320px; width: 100%;">
          <input type="text" id="serviceSearchBox" class="form-control-fixup" placeholder="Search services (e.g. tap, AC, wire)...">
        </div>
      </div>

      <!-- Services Grid -->
      <div class="service-grid" id="allServicesGrid">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('allServicesGrid');
      const searchBox = document.getElementById('serviceSearchBox');
      const catBtns = document.querySelectorAll('.cat-btn');
      let activeCat = 'all';

      // Check URL query param (e.g. ?cat=Plumbing)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('cat')) {
        activeCat = urlParams.get('cat');
        catBtns.forEach(b => {
          b.classList.toggle('btn-primary-fixup', b.dataset.cat.toLowerCase() === activeCat.toLowerCase());
          b.classList.toggle('btn-secondary-fixup', b.dataset.cat.toLowerCase() !== activeCat.toLowerCase());
        });
      }

      function render() {
        const query = searchBox.value.toLowerCase().trim();
        const services = window.FixupStore.getServices();

        const filtered = services.filter(s => {
          const matchCat = activeCat === 'all' || s.category.toLowerCase() === activeCat.toLowerCase();
          const matchQuery = !query || s.name.toLowerCase().includes(query) || s.tagline.toLowerCase().includes(query);
          return matchCat && matchQuery;
        });

        if (filtered.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 48px; color: var(--text-muted);"><i class="fa-solid fa-magnifying-glass" style="font-size: 2rem; margin-bottom: 12px;"></i><p>No services match your search.</p></div>';
          return;
        }

        grid.innerHTML = filtered.map(s => `
          <a href="service-details.html?id=${s.id}" class="service-card-item">
            <div class="service-img-box">
              <img src="${s.image}" alt="${s.name}">
              <span class="service-card-badge">${s.badge || s.category}</span>
              <div class="service-card-rating"><i class="fa-solid fa-star text-warning"></i> ${s.rating} (${s.reviewsCount})</div>
            </div>
            <div class="service-card-body">
              <h3 class="service-card-title">${s.name}</h3>
              <p class="service-card-desc">${s.tagline}</p>
              <div class="service-card-footer">
                <div>
                  <small style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Standard Rate</small>
                  <div class="service-card-price">₹${s.basePrice}</div>
                </div>
                <span class="btn-fixup btn-outline-fixup btn-sm">View Details</span>
              </div>
            </div>
          </a>
        `).join('');
      }

      catBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          catBtns.forEach(b => {
            b.classList.remove('btn-primary-fixup', 'active');
            b.classList.add('btn-secondary-fixup');
          });
          btn.classList.add('btn-primary-fixup', 'active');
          btn.classList.remove('btn-secondary-fixup');
          activeCat = btn.dataset.cat;
          render();
        });
      });

      searchBox.addEventListener('input', render);
      render();
    });
  </script>
</body>
</html>
