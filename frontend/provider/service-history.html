<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service History — Fixup Provider</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/provider.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="provider-layout">
    <div class="container-custom">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.2rem; font-weight: 900;">Service Job History</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin: 4px 0 0 0;">
            Log of all completed dispatches, previous customer feedback, and charges.
          </p>
        </div>
      </div>

      <div class="card-fixup">
        <div id="proHistoryListMount">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = window.FixupStore.getSession();
      if (!session || session.role !== 'SERVICE_PROVIDER') {
        window.location.href = '../pages/login.html';
        return;
      }

      const pro = window.FixupStore.getProviderById(session.userId) || window.FixupStore.getProviders()[0];
      const mount = document.getElementById('proHistoryListMount');
      const jobs = window.FixupStore.getBookingsForProvider(pro.id);

      if (jobs.length === 0) {
        mount.innerHTML = '<p style="text-align: center; padding: 30px; color: var(--text-muted);">No service history records yet.</p>';
        return;
      }

      mount.innerHTML = jobs.map(j => `
        <div style="border-bottom: 1px solid var(--border-color); padding: 18px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="badge-fixup badge-primary">${j.id}</span>
              <span class="badge-fixup ${j.status === 'completed' ? 'badge-success' : 'badge-info'}">${j.status.toUpperCase()}</span>
            </div>
            <h4 style="font-size: 1.15rem; font-weight: 800; margin: 6px 0 2px 0;">${j.serviceName}</h4>
            <div style="font-size: 0.84rem; color: var(--text-muted);">
              Customer: <strong>${j.customerName}</strong> • ${j.customerAddress} • Date: ${j.date}
            </div>
            ${j.reviewText ? `<div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; font-style: italic;">Customer Review: "${j.reviewText}"</div>` : ''}
          </div>
          <div style="text-align: right;">
            <div style="font-size: 1.35rem; font-weight: 900; color: var(--success);">+₹${Math.round(j.totalAmount * 0.85)}</div>
            <span style="font-size: 0.75rem; color: var(--text-muted);">85% Net Split</span>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
