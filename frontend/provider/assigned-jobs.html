<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Work — Fixup Provider Desk</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/provider.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="provider-layout">
    <div class="container-custom">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.2rem; font-weight: 900;">Assigned Work Tasks</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin: 4px 0 0 0;">
            Track customer addresses, navigate to job sites, and collect bill payments.
          </p>
        </div>
        <a href="dashboard.html" class="btn-fixup btn-secondary-fixup btn-sm">
          <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
      </div>

      <div id="assignedJobsContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/provider.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = window.FixupStore.getSession();
      if (!session || session.role !== 'SERVICE_PROVIDER') {
        window.location.href = '../pages/login.html';
        return;
      }
      const pro = window.FixupStore.getProviderById(session.userId) || window.FixupStore.getProviders()[0];
      window.initProviderDashboard();
    });
  </script>
</body>
</html>
