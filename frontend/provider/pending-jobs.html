<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Job Radar — Fixup Provider</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/provider.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="provider-layout">
    <div class="container-custom">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.2rem; font-weight: 900;">Incoming Job Requests & Radar</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin: 4px 0 0 0;">
            Real-time customer requests within an 8-kilometer radius of your service territory.
          </p>
        </div>
      </div>

      <div id="pendingJobsMount">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/theme.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = window.FixupStore.getSession();
      if (!session || session.role !== 'SERVICE_PROVIDER') {
        window.location.href = '../pages/login.html';
        return;
      }

      const pro = window.FixupStore.getProviderById(session.userId) || window.FixupStore.getProviders()[0];
      const mount = document.getElementById('pendingJobsMount');

      function render() {
        const bookings = window.FixupStore.getBookings();
        const pending = bookings.filter(b => b.status === 'pending' && b.category.toLowerCase() === pro.serviceCategory.toLowerCase());

        if (pending.length === 0) {
          mount.innerHTML = `
            <div style="text-align: center; padding: 48px; background: var(--bg-surface); border: 1px dashed var(--border-color); border-radius: var(--radius-xl);">
              <i class="fa-solid fa-satellite-dish fa-spin" style="font-size: 2.5rem; color: var(--success); margin-bottom: 12px;"></i>
              <h4 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 6px;">Radar Active: Scanning for Requests</h4>
              <p style="color: var(--text-muted); font-size: 0.9rem;">No unassigned leads in your area right now. When a customer books, it appears here immediately.</p>
            </div>
          `;
          return;
        }

        mount.innerHTML = pending.map(b => {
          const proShare = Math.round(b.totalAmount * 0.85);
          return `
            <div class="card-fixup" style="margin-bottom: 20px; border-left: 4px solid var(--success);">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 14px;">
                <div>
                  <span class="badge-fixup badge-primary">${b.id}</span>
                  ${b.isEmergency ? '<span class="badge-fixup badge-danger"><i class="fa-solid fa-bolt"></i> Emergency Rush</span>' : ''}
                  <h3 style="font-size: 1.3rem; font-weight: 800; margin-top: 6px;">${b.serviceName}</h3>
                  <p style="color: var(--text-muted); font-size: 0.88rem; margin: 4px 0 0 0;">
                    <i class="fa-solid fa-location-dot text-danger"></i> ${b.customerAddress}
                  </p>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700;">ESTIMATED PRO SHARE</div>
                  <div style="font-size: 1.6rem; font-weight: 900; color: var(--success);">₹${proShare}</div>
                  <span style="font-size: 0.75rem; color: var(--text-muted);">85% Net Split</span>
                </div>
              </div>

              <div style="display: flex; gap: 12px; margin-top: 16px;">
                <button class="btn-fixup btn-primary-fixup btn-sm btn-accept" data-id="${b.id}" style="flex: 2; background: var(--success); border-color: var(--success);">
                  <i class="fa-solid fa-check"></i> Accept Job
                </button>
                <button class="btn-fixup btn-secondary-fixup btn-sm btn-decline" data-id="${b.id}" style="flex: 1;">
                  Decline
                </button>
              </div>
            </div>
          `;
        }).join('');

        mount.querySelectorAll('.btn-accept').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const b = window.FixupStore.getBookingById(id);
            if (b) {
              b.providerId = pro.id;
              b.providerName = pro.name;
              b.status = 'assigned';
              b.statusStep = 2;
              window.FixupStore.save();
              window.FixupToast.show('Job Accepted', `You have accepted order ${id}. View it under Assigned Work.`, 'success');
              render();
            }
          });
        });

        mount.querySelectorAll('.btn-decline').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const card = e.target.closest('.card-fixup');
            card.style.opacity = '0';
            setTimeout(() => card.remove(), 200);
            window.FixupToast.show('Passed Lead', 'Lead passed to next nearby specialist.', 'info');
          });
        });
      }

      render();
    });
  </script>
</body>
</html>
